spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bulletindb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Tolère les migrations appliquées "out of order" (ex: V4.5 ajoutée après V5)
    out-of-order: true
    # Ne bloque pas le démarrage si le checksum d'une migration déjà appliquée a changé
    # (évite l'échec au démarrage quand une migration V17/V18 a été corrigée après déploiement)
    validate-on-migrate: false

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@bulletin.local}

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

server:
  port: ${SERVER_PORT:${PORT:8000}}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  security:
    require-activation: true
    max-login-attempts: 5
    lockout-duration-minutes: 15
    admin-init-key: ${ADMIN_INIT_KEY}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  bulletin:
    # Seuils configurables de mention et decision (en pourcentage)
    mention:
      excellent: 85
      tres-bien: 70
      bien: 60
      satisfaction: 50
    decision:
      admis: 50
      echec: 0

  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
    max-file-size: ${MAX_FILE_SIZE:150MB}

logging:
  level:
    com.bulletin: ${LOG_LEVEL:INFO}
