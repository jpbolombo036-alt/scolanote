spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bulletindb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@bulletin.local}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:${PORT:8000}}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stack-trace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  security:
    require-activation: true
    max-login-attempts: 5
    lockout-duration-minutes: 15
    admin-init-key: ${ADMIN_INIT_KEY}

  frontend:
    url: ${FRONTEND_URL}

  bulletin:
    mention:
      excellent: 85
      tres-bien: 70
      bien: 60
      satisfaction: 50
    decision:
      admis: 50
      echec: 0

  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
    max-file-size: ${MAX_FILE_SIZE:10MB}

  storage:
    # Bucket S3 pour la persistance des PDFs (recommandé sur Railway).
    # Vide = fallback sur le filesystem local (éphémère).
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-url: ${S3_PUBLIC_URL:}

logging:
  level:
    com.bulletin: ${LOG_LEVEL:INFO}
    root: ${ROOT_LOG_LEVEL:WARN}
  # Logs sur STDOUT par défaut (Railway les capture). Définir LOG_FILE pour écrire dans un fichier.
  file:
    name: ${LOG_FILE:}
